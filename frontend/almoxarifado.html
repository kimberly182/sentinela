<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoxarifado</title>
</head>
<body>
    <header class="navbar">
        <div class="nav-brand">
            <div class="logo-icon"></div>
            <div>
                <h1>Hospital Pro - Almoxarifado</h1>
                <span>Gestão de Entrada e Controle de Estoque</span>
            </div>
        </div>
        <div class="nav-user">
            <span class="user-pill" id="nomeUsuario">Almoxarifado</span>
            <a href="index.html" class="btn-nav"> Sair</a>
        </div>
    </header>

    <div class="container">
        <div class="alerta-estoque" id="alertaEstoque" style="display:none">
            <strong>Atenção:</strong> <span id="alertaTexto"></span>
        </div>

        <div class="stats-bar">
        <div class="stat-card">
        <div class="stat-icon purple"></div>
        <div>
            <div class="stat-value" id="statItens">--</div>
            <div class="stat-label">Tipos Cadastrados</div>
        </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon green"></div>
        </div>
        <div class="stat-value" id="statOk">--</div>
        <div class="stat-label">Estoque Normal</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon orange"></div>
        <div>
            <div class="stat-value" id="statBaixo">--</div>
            <div>Estoque Baixo (menor que 10)</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon red"></div>
        <div>
            <div class="stat-value" id="statZerado">--</div>
            <div class="stat-label">Zerados / Esgotados</div>
        </div>
        <div class="main-grid">
    <div>
        <div class="card">
            <div class="card-header">
                <h2>Entrada de medicamentos</h2>
            </div>
            <div class="card-body">
        <!--Tabs: Novo ou Repor-->
        <div class="entrada-tabs">
            <button class="tab-btn active" id="tabNovo" onclick="setTab('novo')">Novo Medicamentos</button>
            <button class="tab-btn" id="tabRepor" onclick="setTab('repor')">Repor Existente</button>
        </div>
        <!-- Painel: Cadastrar Novo -->
         <div id="painelNovo">
            <div class="form-group">
                <label for="emNome">Nome do Medicamento</label>
                <input type="text" id="emNome" class="form-control" 
                placeholder="Ex: Paracetamol 750mg" 
                autocomplete="off">
            </div>
            <div class="form-group">
                <label for="emQtd">Quantidade
                    <small>(unidades a adicionar)</small></label>
                    <input type="number" id="emQtd" class="form-control"
                    value="10" min="1">
            </div>
            <div class="form-group">
                <label for="emUnidade">Tipos de Unidades</label>
                <select id="emUnidade" class="form-group">
            </div>
            <option value="comprimidos">Comprimidos</option>
            <option value="capsula">Capsula</option>
            <option value="frascos">Frascos</option>
            <option value="ampolas">Ampolas</option>
            <option value="saches">Saches</option>
            <option value="unidades">Unidades</option>
            </select>
         </div>
            </div>
        </div>
    </div>
</div>
    </div>
   </div>
</body>
</html>
