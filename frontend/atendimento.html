<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h2>Atendimento</h2>

  <input id="nome" placeholder="Nome completo">

  <input id="cpf" placeholder="CPF">

  <input 
    id="datadeNascimento" 
    type="date" 
    placeholder="Data de nascimento"
  >

  <select id="sexo">
    <option value="">Selecione o Sexo</option>
    <option value="M">Masculino</option>
    <option value="F">Feminino</option>
    <option value="O">Outro</option>
  </select>

  <input 
    id="nomeMae" 
    type="text" 
    placeholder="Nome da mãe"
  >

  <select id="estadoCivil">
    <option value="">Estado Civil</option>
    <option value="solteiro">Solteiro(a)</option>
    <option value="casado">Casado(a)</option>
    <option value="divorciado">Divorciado(a)</option>
    <option value="viuvo">Viúvo(a)</option>
  </select>

  <input id="endereco" placeholder="Endereço">

  <input id="telefone" placeholder="Telefone">

  <input id="email" type="email" placeholder="Email">

  <input 
    id="contatodeEmergencia" 
    placeholder="Contato de Emergência"
  >

  <select id="tipo">
    <option value="Convenio">Convênio</option>
    <option value="Particular">Particular</option>
  </select>

  <!-- Motivo da alta -->
  <input 
    id="motivoAlta" 
    type="text" 
    placeholder="Motivo da alta do paciente"
  >

  <input type="file" id="foto">

  <button onclick="cadastrar()">Cadastrar</button>

</div>

<script>

function cadastrar() {

  fetch("http://localhost:3000/atendimento", {
    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      nome: document.getElementById("nome").value,

      cpf: document.getElementById("cpf").value,

      datadeNascimento: document.getElementById("datadeNascimento").value,

      sexo: document.getElementById("sexo").value,

      nomeMae: document.getElementById("nomeMae").value,

      estadoCivil: document.getElementById("estadoCivil").value,

      endereco: document.getElementById("endereco").value,

      telefone: document.getElementById("telefone").value,

      email: document.getElementById("email").value,

      contatodeEmergencia: document.getElementById("contatodeEmergencia").value,

      tipo: document.getElementById("tipo").value,

      motivoAlta: document.getElementById("motivoAlta").value

    })
  })

  .then(r => r.json())

  .then(data => {

    alert("Paciente enviado para triagem!");

  })

  .catch(err => {

    console.error("Erro:", err);

    alert("Erro ao cadastrar paciente.");

  });

}

</script>

</body>
</html>
