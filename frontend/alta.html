```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Alta Médica</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>

    .alta-container {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    }

    .alta-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #ddd;
      padding-bottom: 15px;
      margin-bottom: 25px;
      gap: 10px;
    }

    .alta-header h2 {
      margin: 0;
    }

    .btn-voltar {
      background: #6c757d;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-voltar:hover {
      background: #545b62;
    }

    .form-grupo {
      margin-bottom: 18px;
    }

    .form-grupo label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-grupo input,
    .form-grupo select,
    .form-grupo textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    .form-grupo textarea {
      min-height: 100px;
      resize: vertical;
    }

    .info-alta {
      background: #f0f4ff;
      border: 1px solid #d0d8f0;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .status-alta {
      display: inline-block;
      background: #28a745;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 13px;
    }

    .botoes {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-preview {
      flex: 1;
      background: #17a2b8;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .btn-preview:hover {
      background: #117a8b;
    }

    /* ==============================
       MODAL DE PRÉ-VISUALIZAÇÃO
    ============================== */

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0,0,0,0.75);
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-conteudo {
      width: 100%;
      max-width: 1000px;
      height: 95vh;
      background: #eee;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      background: #343a40;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      margin: 0;
    }

    .btn-fechar {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-fechar:hover {
      background: #bd2130;
    }

    .pdf-preview {
      flex: 1;
      background: #666;
      padding: 10px;
    }

    .pdf-preview iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
      border-radius: 5px;
    }

    .modal-footer {
      background: white;
      padding: 15px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn-cancelar {
      background: #6c757d;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-confirmar {
      background: #28a745;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-confirmar:hover {
      background: #218838;
    }

    @media (max-width: 600px) {

      .alta-container {
        margin: 10px;
        padding: 20px;
      }

      .alta-header {
        flex-direction: column;
        align-items: stretch;
      }

      .botoes {
        flex-direction: column;
      }

        padding: 5px;
      }

    }

  </style>

</head>


<body>

<div class="alta-container">

  <div class="alta-header">

    <h2>📄 Alta Médica</h2>

    <button
      class="btn-voltar"
      onclick="window.location.href='medico.html'">

      ← Voltar

    </button>

  </div>


  <div class="info-alta">

    <strong>Status:</strong>

    <span class="status-alta">
      ALTA MÉDICA
    </span>

    <p style="margin-bottom:0;">
      Preencha os dados e visualize o documento antes
      de confirmar a alta.
    </p>

  </div>


  <!-- PACIENTE -->

  <div class="form-grupo">

    <label for="paciente">
      Paciente
    </label>

    <select id="paciente">

      <option value="">
        Selecione o paciente
      </option>

    </select>

  </div>


  <!-- DIAGNÓSTICO -->

  <div class="form-grupo">

    <label for="diagnostico">
      Motivo da alta
    </label>

    <input
      type="text"
      id="diagnostico"
      placeholder="Digite o motivo da alta">

  </div>


  <!-- TRATAMENTO -->

  <div class="form-grupo">

    <label for="tratamento">
      Tratamento / Medicação
    </label>

    <input
      type="text"
      id="tratamento"
      placeholder="Tratamento ou medicação prescrita">

  </div>


  <!-- ORIENTAÇÕES -->

  <div class="form-grupo">

    <label for="orientacoes">
      Orientações para o paciente
    </label>

    <textarea
      id="orientacoes"
      placeholder="Digite as orientações para o paciente..."></textarea>

  </div>


  <!-- OBSERVAÇÕES -->

  <div class="form-grupo">

    <label for="observacoes">
      Observações
    </label>

    <textarea
      id="observacoes"
      placeholder="Observações adicionais..."></textarea>

  </div>


  <div class="botoes">

    <button
      class="btn-preview"
      onclick="previsualizar()">

      👁️ Pré-visualizar PDF

    </button>

  </div>

</div>


<!-- ==========================================
     MODAL
========================================== -->

<div
  class="modal"
  id="modalPreview">

  <div class="modal-conteudo">

    <div class="modal-header">

      <h3>
        👁️ Pré-visualização da Alta
      </h3>

      <button
        class="btn-fechar"
        onclick="fecharPreview()">

        ✕ Fechar

      </button>

    </div>


    <div class="pdf-preview">

      <iframe
        id="pdfFrame">
      </iframe>

    </div>


    <div class="modal-footer">

      <button
        class="btn-cancelar"
        onclick="fecharPreview()">

        ← Voltar e Editar

      </button>

      <button
        class="btn-confirmar"
        onclick="confirmarAlta()">

        ✅ Confirmar e Salvar PDF

      </button>

    </div>

  </div>

</div>


<script>

let pacientes = [];

let pdfAtual = null;

let dadosAltaAtual = null;


/* ==========================================
   CARREGAR PACIENTES
========================================== */

function carregarPacientes() {

  fetch("/triagens")

    .then(response => response.json())

    .then(data => {

      pacientes = data;

      const select =
        document.getElementById("paciente");

      select.innerHTML = `
        <option value="">
          Selecione o paciente
        </option>
      `;

      data.forEach((paciente, index) => {

        const option =
          document.createElement("option");

        option.value = index;

        option.textContent =
          paciente.nome;

        select.appendChild(option);

      });

    })

    .catch(error => {

      console.error(
        "Erro ao carregar pacientes:",
        error
      );

      alert(
        "❌ Não foi possível carregar os pacientes."
      );

    });

}


/* ==========================================
   SELECIONAR PACIENTE
========================================== */

document
  .getElementById("paciente")
  .addEventListener(
    "change",
    function() {

      const index =
        this.value;

      if (index === "") {
        return;
      }

      const paciente =
        pacientes[index];

      if (!paciente) {
        return;
      }

      document
        .getElementById("observacoes")
        .value =
          paciente.observacao || "";

    }
  );


/* ==========================================
   PRÉ-VISUALIZAR
========================================== */

async function previsualizar() {

  const select =
    document.getElementById("paciente");

  const index =
    select.value;

  const diagnostico =
    document
      .getElementById("diagnostico")
      .value
      .trim();

  const tratamento =
    document
      .getElementById("tratamento")
      .value
      .trim();

  const orientacoes =
    document
      .getElementById("orientacoes")
      .value
      .trim();

  const observacoes =
    document
      .getElementById("observacoes")
      .value
      .trim();


  /* ==============================
     VALIDAÇÃO
  ============================== */

  if (index === "") {

    alert(
      "⚠️ Selecione um paciente."
    );

    return;

  }


  if (!diagnostico) {

    alert(
      "⚠️ Digite o diagnóstico."
    );

    return;

  }


  const paciente =
    pacientes[index];


  if (!paciente) {

    alert(
      "❌ Paciente não encontrado."
    );

    return;

  }


  const agora =
    new Date();


  const data =
    agora.toLocaleDateString(
      "pt-BR"
    );


  const hora =
    agora.toLocaleTimeString(
      "pt-BR"
    );


  /* ==============================
     GUARDAR DADOS
  ============================== */

  dadosAltaAtual = {

    paciente:
      paciente.nome,

    diagnostico:
      diagnostico,

    tratamento:
      tratamento,

    orientacoes:
      orientacoes,

    observacoes:
      observacoes,

    data:
      data,

    hora:
      hora

  };


  /* ==============================
     GERAR PDF TEMPORÁRIO
  ============================== */

  pdfAtual =
    criarPDF(
      dadosAltaAtual
    );


  /*
    Criar Blob para mostrar
    dentro do iframe.
  */

  const blob =
    pdfAtual.output("blob");


  const url =
    URL.createObjectURL(blob);


  document
    .getElementById("pdfFrame")
    .src = url;


  /* ==============================
     ABRIR MODAL
  ============================== */

  document
    .getElementById("modalPreview")
    .style.display = "flex";

}


/* ==========================================
   CRIAR PDF
========================================== */

function criarPDF(dados) {

  const {
    jsPDF
  } = window.jspdf;


  const pdf =
    new jsPDF();


  /* ==============================
     CABEÇALHO
  ============================== */

  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.setFontSize(20);

  pdf.text(
    "SISTEMA HOSPITALAR",
    105,
    25,
    {
      align: "center"
    }
  );


  pdf.setFontSize(16);

  pdf.text(
    "DOCUMENTO DE ALTA MÉDICA",
    105,
    38,
    {
      align: "center"
    }
  );


  pdf.setLineWidth(0.5);

  pdf.line(
    20,
    45,
    190,
    45
  );


  /* ==============================
     STATUS
  ============================== */

  pdf.setFontSize(12);

  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.text(
    "STATUS: ALTA MÉDICA",
    20,
    58
  );


  /* ==============================
     PACIENTE
  ============================== */

  pdf.setFont(
    "helvetica",
    "normal"
  );

  pdf.text(
    "Paciente:",
    20,
    75
  );

  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.text(
    dados.paciente,
    55,
    75
  );


  /* ==============================
     DATA E HORA
  ============================== */

  pdf.setFont(
    "helvetica",
    "normal"
  );

  pdf.text(
    "Data:",
    20,
    88
  );

  pdf.text(
    dados.data,
    55,
    88
  );


  pdf.text(
    "Horário:",
    110,
    88
  );

  pdf.text(
    dados.hora,
    140,
    88
  );


  let y = 105;


  /* ==============================
     DIAGNÓSTICO
  ============================== */

  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.text(
    "Diagnóstico:",
    20,
    y
  );

  y += 10;

  pdf.setFont(
    "helvetica",
    "normal"
  );

  const diagnostico =
    pdf.splitTextToSize(
      dados.diagnostico ||
      "Não informado",
      165
    );

  pdf.text(
    diagnostico,
    20,
    y
  );

  y +=
    diagnostico.length * 7 +
    10;


  /* ==============================
     TRATAMENTO
  ============================== */

  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.text(
    "Tratamento / Medicação:",
    20,
    y
  );

  y += 10;

  pdf.setFont(
    "helvetica",
    "normal"
  );

  const tratamento =
    pdf.splitTextToSize(
      dados.tratamento ||
      "Não informado",
      165
    );

  pdf.text(
    tratamento,
    20,
    y
  );

  y +=
    tratamento.length * 7 +
    10;


  /* ==============================
     ORIENTAÇÕES
  ============================== */

  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.text(
    "Orientações:",
    20,
    y
  );

  y += 10;

  pdf.setFont(
    "helvetica",
    "normal"
  );

  const orientacoes =
    pdf.splitTextToSize(
      dados.orientacoes ||
      "Nenhuma orientação registrada.",
      165
    );

  pdf.text(
    orientacoes,
    20,
    y
  );

  y +=
    orientacoes.length * 7 +
    10;


  /* ==============================
     OBSERVAÇÕES
  ============================== */

  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.text(
    "Observações:",
    20,
    y
  );

  y += 10;

  pdf.setFont(
    "helvetica",
    "normal"
  );

  const observacoes =
    pdf.splitTextToSize(
      dados.observacoes ||
      "Nenhuma observação registrada.",
      165
    );

  pdf.text(
    observacoes,
    20,
    y
  );


  /* ==============================
     ASSINATURA
  ============================== */

  pdf.line(
    60,
    260,
    150,
    260
  );

  pdf.setFontSize(10);

  pdf.text(
    "Assinatura do médico",
    105,
    267,
    {
      align: "center"
    }
  );


  /* ==============================
     RODAPÉ
  ============================== */

  pdf.setFontSize(9);

  pdf.setTextColor(
    100,
    100,
    100
  );

  pdf.text(
    "Documento gerado pelo Sistema Hospitalar",
    105,
    285,
    {
      align: "center"
    }
  );


  return pdf;

}


/* ==========================================
   FECHAR PRÉ-VISUALIZAÇÃO
========================================== */

function fecharPreview() {

  document
    .getElementById("modalPreview")
    .style.display = "none";

}


/* ==========================================
   CONFIRMAR ALTA
========================================== */

async function confirmarAlta() {

  if (!dadosAltaAtual) {

    alert(
      "❌ Nenhuma alta para confirmar."
    );

    return;

  }


  const botao =
    document.querySelector(
      ".btn-confirmar"
    );


  botao.disabled = true;

  botao.textContent =
    "⏳ Salvando...";


  try {

    /* ==============================
       SALVAR NO SERVIDOR
    ============================== */

    const resposta =
      await fetch(
        "/alta",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              paciente:
                dadosAltaAtual.paciente,

              diagnostico:
                dadosAltaAtual.diagnostico,

              tratamento:
                dadosAltaAtual.tratamento,

              orientacoes:
                dadosAltaAtual.orientacoes,

              observacoes:
                dadosAltaAtual.observacoes

            })

        }
      );


    const resultado =
      await resposta.json();


    if (!resposta.ok) {

      throw new Error(
        resultado.erro ||
        "Erro ao registrar alta."
      );

    }


    /* ==============================
       SALVAR PDF
    ============================== */

    const nomeArquivo =
      "Alta_" +
      dadosAltaAtual.paciente
        .replace(
          /[^a-zA-Z0-9À-ÿ ]/g,
          ""
        )
        .replace(
          /\s+/g,
          "_"
        ) +
      ".pdf";


    pdfAtual.save(
      nomeArquivo
    );


    /* ==============================
       FECHAR MODAL
    ============================== */

    fecharPreview();


    alert(
      "✅ Alta registrada com sucesso!\n\n" +
      "O PDF foi salvo."
    );


    /* ==============================
       VOLTAR PARA MÉDICO
    ============================== */

    window.location.href =
      "medico.html";


  } catch (erro) {

    console.error(
      "Erro ao registrar alta:",
      erro
    );

    alert(
      "❌ Não foi possível registrar a alta.\n\n" +
      erro.message
    );

    botao.disabled = false;

    botao.textContent =
      "✅ Confirmar e Salvar PDF";

  }

}


/* ==========================================
   INICIAR
========================================== */

carregarPacientes();

</script>

</body>

</html>
```
