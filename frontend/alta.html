<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Médico</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .btn-tv {
            background: #28a745;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-tv:hover {
            background: #1e7e34;
        }

        .btn-abrir-tv {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-abrir-tv:hover {
            background: #117a8b;
        }

        .btn-alta {
            background: #7b3fc6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .btn-alta:hover {
            background: #602fa0;
        }

        .consultorio-input {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: #f3effa;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #d8c9ea;
        }

        .consultorio-input label {
            font-weight: bold;
        }

        .consultorio-input input {
            width: 60px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 5px;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        .acoes-consulta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .card {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        ">

            <h2>
                🩺 Painel Médico
            </h2>

            <button
                class="btn-abrir-tv"
                onclick="abrirTV()">

                📺 Abrir Tela da TV

            </button>

        </div>

        <div class="consultorio-input">

            <label>
                Meu Consultório:
            </label>

            <input
                type="text"
                id="consultorio-num"
                value="01"
                maxlength="5">

        </div>

        <div id="triagens"></div>

        <hr>

        <h3>
            Consulta
        </h3>

        <input
            id="paciente"
            placeholder="Paciente"
            readonly>

        <input
            id="diagnostico"
            placeholder="Diagnóstico">

        <select id="medicacao">

            <option value="">
                Selecione a medicação
            </option>

        </select>

        <textarea
            id="obs"
            placeholder="Observações">
        </textarea>

        <div class="acoes-consulta">

            <button onclick="salvar()">
                💾 Salvar Consulta
            </button>

            <button
                class="btn-alta"
                onclick="darAlta()">

                🏠 Dar Alta

            </button>

        </div>

    </div>

    <script>

        let triagensCarregadas = [];

        function abrirTV() {

            window.open(
                "tv.html",
                "_blank"
            );

        }

        function carregar() {

            fetch("/triagens")

                .then(response => {

                    if (!response.ok) {
                        throw new Error(
                            "Erro ao carregar pacientes"
                        );
                    }

                    return response.json();

                })

                .then(data => {

                    triagensCarregadas =
                        Array.isArray(data)
                            ? data
                            : [];

                    const div =
                        document.getElementById(
                            "triagens"
                        );

                    div.innerHTML = "";

                    if (triagensCarregadas.length === 0) {

                        div.innerHTML = `
                            <p style="
                                text-align: center;
                                color: #888;
                            ">
                                🏥 Nenhum paciente na fila.
                            </p>
                        `;

                        return;
                    }

                    triagensCarregadas.forEach(
                        (paciente, index) => {

                            div.innerHTML += `

                                <div class="card">

                                    <h3>
                                        ${paciente.nome || "Paciente"}
                                    </h3>

                                    <p>
                                        <b>Sintoma:</b>
                                        ${paciente.sintoma || "Não informado"}
                                    </p>

                                    <p>
                                        <b>Temperatura:</b>
                                        ${paciente.temperatura || "Não informada"}°C
                                    </p>

                                    <p>
                                        <b>Risco:</b>
                                        ${paciente.risco || "Não informado"}
                                    </p>

                                    <p>
                                        <b>Alergia:</b>
                                        ${paciente.alergia || "Nenhuma"}
                                    </p>

                                    <p>
                                        <b>Observação:</b>
                                        ${paciente.observacao || "Nenhuma"}
                                    </p>

                                    <div style="
                                        display: flex;
                                        gap: 8px;
                                        flex-wrap: wrap;
                                    ">

                                        <button
                                            onclick="selecionar(${index})">

                                            🩺 Atender

                                        </button>

                                        <button
                                            class="btn-tv"
                                            onclick="chamarNaTV(${index})">

                                            📺 Chamar na TV

                                        </button>

                                    </div>

                                </div>
                            `;
                        }
                    );

                })

                .catch(error => {

                    console.error(error);

                    document.getElementById(
                        "triagens"
                    ).innerHTML = `
                        <p style="
                            color: red;
                            text-align: center;
                        ">
                            ❌ Erro ao carregar os pacientes.
                        </p>
                    `;

                });

        }

        function selecionar(index) {

            const paciente =
                triagensCarregadas[index];

            if (!paciente) {

                alert(
                    "❌ Paciente não encontrado."
                );

                return;
            }

            document.getElementById(
                "paciente"
            ).value =
                paciente.nome || "";

            document.getElementById(
                "obs"
            ).value =
                paciente.observacao || "";

            if (
                paciente.alergia &&
                paciente.alergia !== "Nenhuma"
            ) {

                alert(
                    "⚠️ ATENÇÃO!\n\n" +
                    "Alergia: " +
                    paciente.alergia
                );

            }

        }

        function chamarNaTV(index) {

            const paciente =
                triagensCarregadas[index];

            if (!paciente) {

                alert(
                    "❌ Paciente não encontrado."
                );

                return;
            }

            const consultorio =
                document.getElementById(
                    "consultorio-num"
                ).value.trim() || "01";

            fetch("/tv/chamar", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    localTipo:
                        "CONSULTÓRIO",

                    localNumero:
                        consultorio,

                    paciente:
                        paciente.nome

                })

            })

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Erro ao chamar paciente"
                    );

                }

                return response.json();

            })

            .then(() => {

                alert(
                    "📺 " +
                    paciente.nome +
                    " foi chamado para o Consultório " +
                    consultorio +
                    "!"
                );

            })

            .catch(error => {

                console.error(error);

                alert(
                    "❌ Erro ao chamar paciente na TV."
                );

            });

        }

        function carregarMedicacoes() {

            fetch("/lista-medicacoes")

                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Erro ao carregar medicações"
                        );

                    }

                    return response.json();

                })

                .then(data => {

                    const select =
                        document.getElementById(
                            "medicacao"
                        );

                    select.innerHTML = `
                        <option value="">
                            Selecione a medicação
                        </option>
                    `;

                    if (!Array.isArray(data)) {
                        return;
                    }

                    data.forEach(medicamento => {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            medicamento;

                        option.textContent =
                            medicamento;

                        select.appendChild(
                            option
                        );

                    });

                })

                .catch(error => {

                    console.error(
                        "Erro:",
                        error
                    );

                });

        }

        function salvar() {

            const paciente =
                document.getElementById(
                    "paciente"
                ).value.trim();

            const diagnostico =
                document.getElementById(
                    "diagnostico"
                ).value.trim();

            const medicacao =
                document.getElementById(
                    "medicacao"
                ).value;

            const obs =
                document.getElementById(
                    "obs"
                ).value.trim();

            if (!paciente) {

                alert(
                    "⚠️ Selecione um paciente."
                );

                return;
            }

            if (!medicacao) {

                alert(
                    "⚠️ Selecione uma medicação."
                );

                return;
            }

            fetch("/consulta", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    paciente:
                        paciente,

                    diagnostico:
                        diagnostico,

                    medicacao:
                        medicacao,

                    obs:
                        obs

                })

            })

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Erro ao salvar consulta"
                    );

                }

                return response.json();

            })

            .then(() => {

                alert(
                    "✅ Consulta salva com sucesso!"
                );

                document.getElementById(
                    "diagnostico"
                ).value = "";

                document.getElementById(
                    "medicacao"
                ).value = "";

                document.getElementById(
                    "obs"
                ).value = "";

            })

            .catch(error => {

                console.error(error);

                alert(
                    "❌ Erro ao salvar consulta."
                );

            });

        }

        function darAlta() {

            const paciente =
                document.getElementById(
                    "paciente"
                ).value.trim();

            if (!paciente) {

                alert(
                    "⚠️ Selecione um paciente antes de dar alta."
                );

                return;
            }

            const confirmar =
                confirm(
                    "🏠 Deseja realmente dar alta para:\n\n" +
                    paciente +
                    "?"
                );

            if (!confirmar) {

                return;
            }

            fetch("/alta", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    paciente:
                        paciente

                })

            })

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Erro ao realizar alta"
                    );

                }

                return response.json();

            })

            .then(data => {

                if (data.erro) {

                    alert(
                        "❌ " +
                        data.erro
                    );

                    return;
                }

                alert(
                    "🏠 Alta realizada com sucesso!\n\n" +
                    "Paciente: " +
                    paciente
                );

                document.getElementById(
                    "paciente"
                ).value = "";

                document.getElementById(
                    "diagnostico"
                ).value = "";

                document.getElementById(
                    "medicacao"
                ).value = "";

                document.getElementById(
                    "obs"
                ).value = "";

                carregar();

            })

            .catch(error => {

                console.error(
                    "Erro na alta:",
                    error
                );

                alert(
                    "❌ Não foi possível realizar a alta."
                );

            });

        }

        carregar();

        carregarMedicacoes();

        setInterval(
            carregar,
            10000
        );

    </script>

</body>

</html>
